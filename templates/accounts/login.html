{% extends "base.html" %}
{% block content %}


<!-- Page Header Start -->
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Sign In</h1>
   
</div>
<!-- Page Header End -->



<div class="container py-5" style="min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4 fw-bold">Login</h3>
                    <p class="text-center text-muted mb-4">Enter your credentials to continue</p>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Login</button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        Don't have an account? <a href="{% url 'register' %}" class="text-success fw-bold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
